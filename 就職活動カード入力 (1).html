<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>就職活動カード入力</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#1d3f8c">
<style>
:root{
  --ink:#1c2430; --muted:#566273; --paper:#edf0f5; --field:#ffffff; --line:#c6cedb;
  --accent:#1d3f8c; --accent-soft:#e2e9f8; --ok:#14764a; --warn:#9a5200; --warn-bg:#fff3e0;
  --err:#b3261e; --err-bg:#fdecea;
  --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
  --bar-h:76px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-bottom:calc(var(--bar-h) + 24px + env(safe-area-inset-bottom,0px))}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--sans);-webkit-tap-highlight-color:transparent;touch-action:manipulation;overflow-x:hidden}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{width:100%;max-width:600px;margin:0 auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(var(--bar-h) + 32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

/* 見出し: 紙のカードの題字を模した枠 */
.top{margin:4px 0 8px}
.title{margin:0;padding:14px 12px 12px;border:1.5px solid var(--ink);background:var(--field);text-align:center;font-size:21px;font-weight:700;letter-spacing:.32em;text-indent:.32em;line-height:1.3}
.status{display:flex;justify-content:space-between;gap:8px;margin:8px 2px 0;font-size:13px;color:var(--muted)}

.grp{padding:20px 0 4px;border-top:1px solid var(--line);margin-top:18px}
.top + .grp{margin-top:10px}
.grp>h2{margin:0 0 12px;font-size:15px;font-weight:700;letter-spacing:.06em}
.hint{margin:6px 2px 0;font-size:13px;color:var(--muted);line-height:1.5}

.fld{display:block;margin:0 0 14px}
.lblrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 2px 6px}
.lbl{font-size:14px;font-weight:700}
.cnt{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.cnt.over{color:var(--err);font-weight:700}
.in{display:block;width:100%;min-height:52px;padding:10px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--field);font-size:16px;line-height:1.4;-webkit-appearance:none;appearance:none;border-radius:6px}
select.in{padding-right:36px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat}
input[type=date].in,input[type=time].in{display:flex;align-items:center;text-align:left;min-width:0}
textarea.in{min-height:140px;resize:vertical;line-height:1.55}
.in:focus-visible,.chip input:focus-visible+.box,.btn:focus-visible,.link:focus-visible{outline:3px solid #6f93e6;outline-offset:2px}
.in:focus{border-color:var(--accent)}
.in.bad{border-color:var(--err);background:var(--err-bg)}

.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.trio .fld{margin-bottom:14px}
.unit{display:flex;align-items:center;gap:6px}
.unit .in{text-align:center;padding-left:6px;padding-right:6px}
.unit span{font-size:15px;font-weight:700;flex:none}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:339px){.pair{grid-template-columns:1fr}}
.pair .cnt{display:none}
.pair .lbl{white-space:nowrap}

/* 選択肢: 項目全体がタップ領域。選択時はWordの ☒ と同じ表示 */
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:10px;margin:0 0 14px}
.chips.one{grid-template-columns:1fr}
.chip{position:relative;display:block;cursor:pointer}
.chip input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.chip .box{display:flex;align-items:center;gap:10px;min-height:54px;padding:8px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--field);line-height:1.35;transition:background-color .12s,border-color .12s}
.chip .mark{flex:none;width:24px;height:24px;border:2px solid var(--muted);background:#fff;display:grid;place-items:center;font-size:20px;line-height:1;font-weight:700;color:var(--accent)}
.chip .mark::after{content:""}
.chip input:checked+.box{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.chip input:checked+.box .mark{border-color:var(--accent)}
.chip input:checked+.box .mark::after{content:"\00d7"}
.chip .box>span:last-child{word-break:keep-all;line-break:strict;overflow-wrap:break-word}
.chip small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.sub{margin:2px 0 14px;padding:12px;border-left:4px solid var(--accent);background:#f7f9fd}
.sub .lbl{display:block;margin-bottom:8px}
.sub .chips{margin-bottom:0}
[hidden]{display:none!important}

/* 下部固定バー */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(237,240,245,.96);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.bar>div{max-width:600px;margin:0 auto}
body.kb .bar{display:none}
body.kb .wrap{padding-bottom:120px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;padding:10px 16px;border:0;border-radius:6px;background:var(--accent);color:#fff;font-size:17px;font-weight:700;letter-spacing:.04em;cursor:pointer}
.btn:active{filter:brightness(.9)}
a.btn{text-decoration:none}
.btn[disabled]{background:#9aa6bd;cursor:not-allowed}
.btn.sec{background:var(--field);color:var(--accent);border:1.5px solid var(--accent)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);font-weight:600}
.link{display:inline-block;min-height:44px;padding:10px 4px;border:0;background:none;color:var(--accent);font-size:14px;text-decoration:underline;cursor:pointer}
.foot{margin-top:22px;padding-top:8px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px 16px}

/* 確認シート */
.ov{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(20,28,40,.55)}
.sheet{width:100%;max-width:600px;max-height:92%;max-height:92dvh;overflow:auto;overscroll-behavior:contain;background:var(--paper);border-radius:14px 14px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.ov{align-items:center}.sheet{border-radius:14px;max-height:88%}}
.sheet h2{margin:0 0 4px;font-size:18px;outline:none}
.sum{margin:12px 0;border:1px solid var(--line);background:var(--field);border-radius:6px}
.sum dl{margin:0}
.sum .r{display:grid;grid-template-columns:5.5em 1fr;gap:8px;padding:10px 12px;border-top:1px solid #e3e8ef}
.sum .r:first-child{border-top:0}
.sum dt{font-size:13px;color:var(--muted);font-weight:700}
.sum dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.sum dd.none{color:var(--warn);font-weight:700}
.note{margin:10px 0;padding:10px 12px;border-radius:6px;font-size:14px;line-height:1.55}
.note.err{background:var(--err-bg);color:var(--err);border:1px solid #f1b9b4}
.note.warn{background:var(--warn-bg);color:var(--warn);border:1px solid #f2cf9f}
.note ul{margin:4px 0 0;padding-left:1.2em}
.acts{display:grid;gap:10px;margin-top:14px}
.vlist{list-style:none;margin:10px 0;padding:0;border:1px solid var(--line);background:var(--field);border-radius:6px}
.vlist li{display:grid;grid-template-columns:1.6em 1fr;gap:4px;padding:8px 12px;border-top:1px solid #e3e8ef;font-size:14px;line-height:1.5}
.vlist li:first-child{border-top:0}
.vlist .ok{color:var(--ok);font-weight:700}
.vlist .ng{color:var(--err);font-weight:700}
.vlist small{display:block;color:var(--muted);overflow-wrap:anywhere}
.done{margin:0;font-size:14px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(var(--bar-h) + 16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;max-width:calc(100% - 32px);padding:10px 16px;border-radius:6px;background:#1c2430;color:#fff;font-size:14px}

.file{margin:12px 0;padding:12px;border:1px solid var(--line);background:var(--field);border-radius:6px}
.file h3{margin:0 0 2px;font-size:15px}
.file .fn{margin:0 0 10px;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.file details{margin:10px 0 0}
.file summary{min-height:44px;display:flex;align-items:center;font-size:14px;cursor:pointer}
.file .vlist{margin:0}
.file .btn{min-height:52px}
.file.bad{border-color:var(--err)}
.sum .head{padding:8px 12px;background:#f1f4f9;font-size:13px;font-weight:700;border-top:1px solid #e3e8ef}
.sub .lbl{display:block}

.pv{margin:10px 0 0;border:1px solid var(--line);background:#8a93a3;border-radius:6px;overflow:hidden}
.pv.z{overflow:auto;max-height:72vh;max-height:72dvh;overscroll-behavior:contain}
.pv-box{margin:0 auto;padding:8px 0}
.pv-in{transform-origin:0 0}
.pv-in section.docx{margin:0 0 12px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.pv .msg{padding:18px 14px;color:#fff;font-size:14px}
.pvbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:8px 0 10px}
.pvbar span{font-size:12.5px;color:var(--muted);line-height:1.45}
.pvbar .link{flex:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="wrap" id="app">
  <header class="top">
    <h1 class="title">就職活動カード</h1>
    <div class="status"><span>A5のWordカードに差し込みます</span><span id="saved" aria-live="polite"></span></div>
  </header>

  <section class="grp" aria-labelledby="g-me">
    <h2 id="g-me">あなた</h2>
    <label class="fld"><span class="lblrow"><span class="lbl">学科</span></span>
      <select class="in" data-k="course" id="course" autocomplete="off">
        <option>ITエンジニア科4年制</option><option>ITエンジニア科</option><option>情報処理科</option>
        <option>情報ネットワーク科</option><option>ネットワークセキュリティ科</option><option>Webクリエイター科</option>
        <option>ITビジネス科</option><option>こども学科</option>
      </select></label>
    <div class="trio">
      <label class="fld"><span class="lblrow"><span class="lbl">年</span></span>
        <input class="in" data-k="year" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="年"></label>
      <label class="fld"><span class="lblrow"><span class="lbl">組</span></span>
        <input class="in" data-k="cls" maxlength="4" autocomplete="off" aria-label="組"></label>
      <label class="fld"><span class="lblrow"><span class="lbl">番</span></span>
        <input class="in" data-k="num" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="番"></label>
    </div>
    <p class="hint" style="margin-top:-6px;margin-bottom:14px">年・組・番は半角2文字までです。</p>
    <label class="fld"><span class="lblrow"><span class="lbl">氏名</span><span class="cnt" data-cnt="name"></span></span>
      <input class="in" data-k="name" autocomplete="name" enterkeyhint="next" placeholder="山田 太郎"></label>
  </section>

  <section class="grp" aria-labelledby="g-co">
    <h2 id="g-co">企業</h2>
    <label class="fld"><span class="lblrow"><span class="lbl">企業名</span><span class="cnt" data-cnt="company"></span></span>
      <input class="in" data-k="company" autocomplete="organization" enterkeyhint="done" placeholder="株式会社○○"></label>
  </section>

  <section class="grp" aria-labelledby="g-pl">
    <h2 id="g-pl">場所</h2>
    <div class="chips" role="radiogroup" aria-labelledby="g-pl">
      <label class="chip"><input type="radio" name="place" value="company"><span class="box"><span class="mark"></span><span>企業</span></span></label>
      <label class="chip"><input type="radio" name="place" value="home"><span class="box"><span class="mark"></span><span>自宅<small>Web／リモート</small></span></span></label>
      <label class="chip"><input type="radio" name="place" value="school"><span class="box"><span class="mark"></span><span>学校</span></span></label>
      <label class="chip"><input type="radio" name="place" value="other"><span class="box"><span class="mark"></span><span>その他</span></span></label>
    </div>
    <label class="fld" id="w-station" hidden><span class="lblrow"><span class="lbl">最寄駅</span><span class="cnt" data-cnt="station"></span></span>
      <input class="in" data-k="station" enterkeyhint="done" placeholder="津田沼"></label>
    <label class="fld" id="w-other" hidden><span class="lblrow"><span class="lbl">場所（その他）</span><span class="cnt" data-cnt="otherPlace"></span></span>
      <input class="in" data-k="otherPlace" enterkeyhint="done" placeholder="例：○○会館"></label>
  </section>

  <section class="grp" aria-labelledby="g-dt">
    <h2 id="g-dt">日時</h2>
    <label class="fld"><span class="lblrow"><span class="lbl">日付</span></span>
      <input class="in" type="date" data-k="date"></label>
    <div class="pair">
      <label class="fld"><span class="lblrow"><span class="lbl">開始</span></span>
        <input class="in" type="time" data-k="start" step="60"></label>
      <label class="fld"><span class="lblrow"><span class="lbl">終了</span></span>
        <input class="in" type="time" data-k="end" step="60"></label>
    </div>
  </section>

  <section class="grp" aria-labelledby="g-ac">
    <h2 id="g-ac">活動の種類</h2>
    <div class="chips" role="radiogroup" aria-labelledby="g-ac" id="acts"></div>
    <div class="sub" id="w-sub" hidden>
      <span class="lbl" id="l-sub">説明会のあと</span>
      <div class="chips one" role="radiogroup" aria-labelledby="l-sub">
        <label class="chip"><input type="radio" name="sub" value="proceed"><span class="box"><span class="mark"></span><span>選考に進む予定</span></span></label>
        <label class="chip"><input type="radio" name="sub" value="noproceed"><span class="box"><span class="mark"></span><span>選考には進まない予定</span></span></label>
      </div>
    </div>
  </section>

  <section class="grp" id="detail" aria-labelledby="l-body" hidden>
    <h2 id="g-dtl"></h2>
    <label class="fld"><span class="lblrow"><span class="lbl" id="l-body"></span><span class="cnt" data-cnt="body"></span></span>
      <textarea class="in" data-k="body" id="body" rows="5" enterkeyhint="enter"></textarea></label>
    <p class="hint" id="h-body"></p>
  </section>


  <section class="grp" id="report" aria-labelledby="g-rp" hidden>
    <h2 id="g-rp">受験報告書</h2>
    <p class="hint" style="margin:-4px 2px 14px">「選考受験」を選んだので、受験報告書（Word）も一緒に作ります。学科・年組番・氏名・企業名・日付はカードの入力が使われます。担任欄は空欄のままです。</p>
    <label class="fld"><span class="lblrow"><span class="lbl">職種</span><span class="cnt" data-cnt="r_job"></span></span><input class="in" data-k="r_job" enterkeyhint="done" placeholder="例：SE" autocomplete="off"></label>
    <label class="fld"><span class="lblrow"><span class="lbl">本社住所</span><span class="cnt" data-cnt="r_addr"></span></span><input class="in" data-k="r_addr" enterkeyhint="done" placeholder="例：東京都千代田区丸の内1-1-1" autocomplete="off"></label>
    <span class="lbl" id="l-stage" style="display:block;margin:0 2px 6px">選考段階</span>
    <div class="chips" role="radiogroup" aria-labelledby="l-stage" data-build="stage"></div>
    <span class="lbl" id="l-fmt" style="display:block;margin:0 2px 6px">形式</span>
    <div class="chips" role="radiogroup" aria-labelledby="l-fmt" data-build="fmt"></div>
    <label class="fld"><span class="lblrow"><span class="lbl">対策のポイント・アドバイス</span><span class="cnt" data-cnt="r_advice"></span></span><textarea class="in" data-k="r_advice" rows="4" placeholder="後輩へのアドバイスを書きます"></textarea></label>
    <span class="lbl" id="l-exam" style="display:block;margin:6px 2px 6px">受けた試験（あてはまるものを選ぶ）</span>
    <div class="chips" role="group" aria-labelledby="l-exam" data-build="exam"></div>

    <div class="sub" id="p-apt" hidden>
      <span class="lbl" style="display:block;margin-bottom:8px">学科適性</span>
      <label class="fld"><span class="lblrow"><span class="lbl">時間（分）</span><span class="cnt">半角3桁まで</span></span><input class="in" data-k="r_apt_min" data-num="3" inputmode="numeric" pattern="[0-9]*" autocomplete="off"></label>
      <span class="lbl" id="l-aptk" style="display:block;margin:0 2px 6px">種類（複数選べます）</span>
      <div class="chips" role="group" aria-labelledby="l-aptk" data-build="aptk"></div>
      <label class="fld" id="w-aptother" hidden><span class="lblrow"><span class="lbl">その他の内容</span><span class="cnt" data-cnt="r_apt_other"></span></span><input class="in" data-k="r_apt_other" enterkeyhint="done" placeholder="空欄なら「クリックして入力」のままです" autocomplete="off"></label>
      <label class="fld"><span class="lblrow"><span class="lbl">内容・問題例</span><span class="cnt" data-cnt="r_apt_content"></span></span><textarea class="in" data-k="r_apt_content" rows="4" placeholder="例：言語・非言語の計算問題"></textarea></label>
    </div>
    <div class="sub" id="p-gw" hidden>
      <span class="lbl" style="display:block;margin-bottom:8px">グループワーク・ディスカッション</span>
      <div class="pair"><label class="fld"><span class="lblrow"><span class="lbl">時間（分）</span><span class="cnt">半角3桁まで</span></span><input class="in" data-k="r_gw_min" data-num="3" inputmode="numeric" pattern="[0-9]*" autocomplete="off"></label><label class="fld"><span class="lblrow"><span class="lbl">試験官（人）</span><span class="cnt">半角3桁まで</span></span><input class="in" data-k="r_gw_ex" data-num="3" inputmode="numeric" pattern="[0-9]*" autocomplete="off"></label></div>
      <label class="fld"><span class="lblrow"><span class="lbl">1グループの人数（人）</span><span class="cnt">半角2桁まで</span></span><input class="in" data-k="r_gw_size" data-num="2" inputmode="numeric" pattern="[0-9]*" autocomplete="off"></label>
      <label class="fld"><span class="lblrow"><span class="lbl">テーマ</span><span class="cnt" data-cnt="r_gw_theme"></span></span><input class="in" data-k="r_gw_theme" enterkeyhint="done" placeholder="例：新サービスの企画" autocomplete="off"></label>
    </div>
    <div class="sub" id="p-es" hidden>
      <span class="lbl" style="display:block;margin-bottom:8px">作文</span>
      <div class="pair"><label class="fld"><span class="lblrow"><span class="lbl">時間（分）</span><span class="cnt">半角3桁まで</span></span><input class="in" data-k="r_es_min" data-num="3" inputmode="numeric" pattern="[0-9]*" autocomplete="off"></label><label class="fld"><span class="lblrow"><span class="lbl">文字数（字）</span><span class="cnt">半角4桁まで</span></span><input class="in" data-k="r_es_chars" data-num="4" inputmode="numeric" pattern="[0-9]*" autocomplete="off"></label></div>
      <span class="lbl" id="l-ess" style="display:block;margin:0 2px 6px">書き方</span>
      <div class="chips" role="radiogroup" aria-labelledby="l-ess" data-build="ess"></div>
      <label class="fld"><span class="lblrow"><span class="lbl">テーマ</span><span class="cnt" data-cnt="r_es_theme"></span></span><input class="in" data-k="r_es_theme" enterkeyhint="done" placeholder="例：私の強み" autocomplete="off"></label>
    </div>
    <div class="sub" id="p-iv" hidden>
      <span class="lbl" style="display:block;margin-bottom:8px">面接</span>
      <div class="pair"><label class="fld"><span class="lblrow"><span class="lbl">時間（分）</span><span class="cnt">半角3桁まで</span></span><input class="in" data-k="r_iv_min" data-num="3" inputmode="numeric" pattern="[0-9]*" autocomplete="off"></label><label class="fld"><span class="lblrow"><span class="lbl">試験官（人）</span><span class="cnt">半角3桁まで</span></span><input class="in" data-k="r_iv_ex" data-num="3" inputmode="numeric" pattern="[0-9]*" autocomplete="off"></label></div>
      <span class="lbl" id="l-ivk" style="display:block;margin:0 2px 6px">種類</span>
      <div class="chips" role="group" aria-labelledby="l-ivk" data-build="ivk"></div>
      <div id="w-ivcount" hidden><label class="fld"><span class="lblrow"><span class="lbl">受験者の人数（人）</span><span class="cnt">半角2桁まで</span></span><input class="in" data-k="r_iv_count" data-num="2" inputmode="numeric" pattern="[0-9]*" autocomplete="off"></label></div>
      <label class="fld"><span class="lblrow"><span class="lbl">質問事項</span><span class="cnt" data-cnt="r_iv_q"></span></span><textarea class="in" data-k="r_iv_q" rows="4" placeholder="例：志望動機、学生時代に力を入れたこと"></textarea></label>
    </div>
  </section>

  <div class="foot">
    <button type="button" class="link" id="b-next">次のカードを作る（氏名などは残す）</button>
    <button type="button" class="link" id="b-clear">入力をすべて消す</button>
  </div>
</main>

<div class="bar" id="bar"><div><button type="button" class="btn" id="b-open">入力内容を確認する</button></div></div>

<div class="ov" id="ov" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="s-title" id="sheet">
    <div id="s-confirm">
      <h2 id="s-title" tabindex="-1">入力内容の確認</h2>
      <div id="s-notes"></div>
      <div class="sum" id="s-sum"></div>
      <div class="acts">
        <button type="button" class="btn" id="b-gen">Wordを生成する</button>
        <button type="button" class="btn ghost" id="b-back">戻って直す</button>
      </div>
    </div>
    <div id="s-done" hidden>
      <h2 id="s-title2" tabindex="-1">Wordを生成しました</h2>
      <p class="done">内容を確認してから、各ファイルをダウンロードしてください。</p>
      <div id="s-files"></div>
      <div class="acts">
        <button type="button" class="btn sec" id="b-all" hidden>すべてダウンロード</button>
        <button type="button" class="btn sec" id="b-share" hidden>共有・Wordで開く</button>
        <button type="button" class="btn ghost" id="b-back2">入力画面に戻る</button>
      </div>
    </div>
  </div>
</div>

  function oneLine(s) { return String(s || '').replace(/[\r\n]+/g, ' ').trim(); }

  /* 選考受験のときは受験報告書の枠(氏名・企業名)に合わせて上限を厳しくする */
  function effUnits(key, d) {

  /* ---- 入力チェック ---- */
  function validate(d) {
    var errors = [], warnings = [];
    function chk1(key, text) {
      var L = LIMITS[key], lim = effUnits(key, d), u = measure(oneLine(text));
      if (u > lim) errors.push({ field: key, msg: L.label + 'が長すぎます（全角換算で' + Math.ceil(u) + '文字／上限' + lim + '文字' + (lim < L.units ? '・受験報告書の枠に合わせた上限' : '') + '）' });

    if (d.place === 'company') chk1('station', d.station);

    [['year', '年'], ['cls', '組'], ['num', '番']].forEach(function (p) {
      if (tiny(d[p[0]]).length > LIMITS.tiny.chars) errors.push({ field: p[0], msg: p[1] + 'は半角' + LIMITS.tiny.chars + '文字までです' });

      errors.push({ field: 'body', msg: '記入欄が' + lines + '行になります（最大' + LIMITS.body.lines + '行・1行は全角約' + LIMITS.body.perLine + '文字）' });
    }
    [['name', d.name], ['company', d.company], ['station', d.station], ['otherPlace', d.otherPlace], ['body', d.body]].forEach(function (p) {
      if (hasUnsupported(p[1])) errors.push({ field: p[0], msg: '絵文字・特殊な文字は使えません（Wordの書式が変わるため）' });
    });

    if (!oneLine(d.company)) warnings.push({ field: 'company', msg: '企業名' });
    if (!d.place) warnings.push({ field: 'place', msg: '場所' });
    if (!d.date) warnings.push({ field: 'date', msg: '日付' });
    if (!d.start) warnings.push({ field: 'start', msg: '開始時刻' });
    if (!d.act) warnings.push({ field: 'act', msg: '活動の種類' });
    if (d.act === 'setsumei' && !d.sub) warnings.push({ field: 'sub', msg: '説明会のあとの予定' });
    if (d.act && !cleanBody(d.body)) warnings.push({ field: 'body', msg: '記入欄' });
    if (d.start && d.end && d.end < d.start) warnings.push({ field: 'end', msg: '終了時刻が開始より前です' });
    return { errors: errors, warnings: warnings, lines: lines };
  }

  /* ---- XML操作ヘルパ ---- */
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function need(cond, what) { if (!cond) throw new Error('テンプレートの構造が想定と異なります: ' + what); }

  function sdtRange(xml, id) {
    var idx = xml.indexOf('<w:id w:val="' + id + '"/>');
    need(idx >= 0, 'コンテンツコントロール ' + id);
    var s = xml.lastIndexOf('<w:sdt>', idx);
    var e = xml.indexOf('</w:sdt>', idx) + '</w:sdt>'.length;
    need(s >= 0 && e > idx, 'sdt範囲 ' + id);
    return [s, e];
  }
  function patchSdt(xml, id, fn) {
    var r = sdtRange(xml, id);
    return xml.slice(0, r[0]) + fn(xml.slice(r[0], r[1])) + xml.slice(r[1]);
  }
  function setCheckbox(xml, id) {
    return patchSdt(xml, id, function (seg) {
      need(seg.indexOf('<w14:checked w14:val="0"/>') >= 0 && seg.indexOf('<w:t>\u2610</w:t>') >= 0, 'チェックボックス ' + id);
      return seg.replace('<w14:checked w14:val="0"/>', '<w14:checked w14:val="1"/>').replace('<w:t>\u2610</w:t>', '<w:t>\u2612</w:t>');
    });
  }
  function fillTextSdt(xml, id, text) {
    return patchSdt(xml, id, function (seg) {
      var m = /<w:sdtPr><w:rPr>([\s\S]*?)<\/w:rPr>/.exec(seg);
      need(m, 'テキスト欄の書式 ' + id);
      var cs = seg.indexOf('<w:sdtContent>');
      need(cs > 0, 'sdtContent ' + id);
      return seg.slice(0, cs).replace('<w:showingPlcHdr/>', '') +
        '<w:sdtContent><w:r><w:rPr>' + m[1] + '</w:rPr><w:t xml:space="preserve">' + esc(text) + '</w:t></w:r></w:sdtContent></w:sdt>';
    });
  }
  function fillCombo(xml, id, text) {
    return patchSdt(xml, id, function (seg) {
      var m = /<w:sdtContent><w:r[^>]*><w:rPr>([\s\S]*?)<\/w:rPr>/.exec(seg);
      need(m, '学科の書式');
      var cs = seg.indexOf('<w:sdtContent>');
      return seg.slice(0, cs) +
        '<w:sdtContent><w:r><w:rPr>' + m[1] + '</w:rPr><w:t xml:space="preserve">' + esc(text) + '</w:t></w:r></w:sdtContent></w:sdt>';
    });
  }
  var RUN_RPR = '<w:rPr><w:rFonts w:hint="eastAsia"/></w:rPr>'; // テンプレートの固定文字と同じ書式
  function runOf(t) { return t === '' ? '' : '<w:r>' + RUN_RPR + '<w:t xml:space="preserve">' + esc(t) + '</w:t></w:r>'; }

  var WD = ['日', '月', '火', '水', '木', '金', '土'];
  function dateParts(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');

  /* ---- 差し込み本体: 元のdocument.xmlの該当箇所だけを書き換える ---- */
  function buildDocXml(tplXml, d) {

    if (d.course) x = fillCombo(x, IDS.course, d.course);
    x = setParas(x, PARA.year, [tiny(d.year)]);
    x = setParas(x, PARA.cls, [tiny(d.cls)]);
    x = setParas(x, PARA.num, [tiny(d.num)]);
    x = setParas(x, PARA.name, [oneLine(d.name)]);
    x = setParas(x, PARA.company, [oneLine(d.company)]);

    if (d.place && IDS.place[d.place]) x = setCheckbox(x, IDS.place[d.place]);
    var st = d.place === 'company' ? oneLine(d.station) : '';

  function b64ToBytes(b64) {

  /* 汎用検証: 元テンプレートと生成物の構造を比較する (カード・受験報告書で共用)

  async function verifyDoc(templateBytes, outBytes, cfg) {

    var tz = await JSZip.loadAsync(templateBytes);
    var oz;

    var tx = await tz.file(DOC).async('string');
    var ox = await oz.file(DOC).async('string');

    var wf = true;
    if (typeof DOMParser !== 'undefined') {
      wf = new DOMParser().parseFromString(ox, 'application/xml').getElementsByTagName('parsererror').length === 0;
    }

    var tn = Object.keys(tz.files).sort(), on = Object.keys(oz.files).sort();
    add(eqArr(tn, on), 'ファイル構成が元と同一', tn.length + '個');

    var diff = [];
    for (var i = 0; i < tn.length; i++) {
      var n = tn[i];
      if (n === DOC || tz.files[n].dir) continue;
      var a = await tz.file(n).async('uint8array');
      var bf = oz.file(n);
      var b = bf ? await bf.async('uint8array') : null;

    }

    var sect = all(/<w:sectPr[\s\S]*?<\/w:sectPr>/g, tx), osect = all(/<w:sectPr[\s\S]*?<\/w:sectPr>/g, ox);
    add(eqArr(sect, osect) && ox.indexOf(cfg.pgSz) >= 0, '用紙サイズ・向き・余白が維持', cfg.pgLabel || '');

    var tbl = all(/<w:tblPr>[\s\S]*?<\/w:tblGrid>/g, tx), otbl = all(/<w:tblPr>[\s\S]*?<\/w:tblGrid>/g, ox);
    add(eqArr(tbl, otbl), '表の幅・位置・罫線・列幅が維持');

    var okStruct = all(/<w:tbl>/g, tx).length === all(/<w:tbl>/g, ox).length &&
      all(/<w:tr[ >]/g, tx).length === all(/<w:tr[ >]/g, ox).length &&
      all(/<w:tc>/g, tx).length === all(/<w:tc>/g, ox).length &&
      eqArr(all(/<w:trPr>[\s\S]*?<\/w:trPr>/g, tx), all(/<w:trPr>[\s\S]*?<\/w:trPr>/g, ox)) &&
      eqArr(all(/<w:tcPr>[\s\S]*?<\/w:tcPr>/g, tx), all(/<w:tcPr>[\s\S]*?<\/w:tcPr>/g, ox));
    add(okStruct, '表構造(行・セル・結合・高さ・罫線)が維持');

    add(eqArr(all(/<w:pPr>[\s\S]*?<\/w:pPr>/g, tx), all(/<w:pPr>[\s\S]*?<\/w:pPr>/g, ox)), '段落設定(配置・インデント・タブ)が維持');

    var tset = {};
    all(/<w:rPr>[\s\S]*?<\/w:rPr>/g, tx).forEach(function (s) { tset[s] = 1; });
    var newFmt = all(/<w:rPr>[\s\S]*?<\/w:rPr>/g, ox).filter(function (s) { return !tset[s]; });
    add(newFmt.length === 0, 'フォント・文字書式が新規に追加されていない', newFmt[0] || '');

    var tcb = all(CB_RE, tx), ocb = all(CB_RE, ox);

    add(lost.length === 0, '固定文字が消えていない', lost.join(' / '));

    var miss = (cfg.texts || []).filter(function (t) { return t && ox.indexOf(esc(t)) < 0; });
    add(miss.length === 0, '入力値がすべて差し込まれている', miss[0] || '');

    add(cfg.fit.ok, '入力量が枠内(行数が増えず、ページが増えない見込み)', cfg.fit.detail);
    return res;
  }

  /* 就職活動カード用 */
  async function verify(templateBytes, outBytes, d) {

  });
  $('#app').addEventListener('click', function (e) {
    var el = e.target;
    /* 選択済みの項目をもう一度タップすると選択を外せる(受験報告書の項目のみ) */
    if (el.type === 'radio' && el.hasAttribute('data-clear') && S[el.name] === el.value) {
      el.checked = false; S[el.name] = ''; render(); saveNow();
    }
  });
  $('#app').addEventListener('change', function (e) {
    var el = e.target;
    if (el.type === 'radio') { S[el.name] = el.value; render(); saveNow(); return; }
    if (el.hasAttribute && el.hasAttribute('data-flag')) { S[el.getAttribute('data-flag')] = el.checked ? '1' : ''; render(); saveNow(); return; }
    if (el.hasAttribute && el.hasAttribute('data-multi')) {
      var key = el.getAttribute('data-multi');
      S[key] = $$('input[data-multi="' + key + '"]').filter(function (c) { return c.checked; }).map(function (c) { return c.value; }).join(',');
      render(); saveNow(); return;
    }
    var k = el.getAttribute && el.getAttribute('data-k');
    if (k) { S[k] = el.value; updateCounters(); saveNow(); }
  });
  /* ソフトウェアキーボード表示中は下部固定バーを隠す */
  var kbT;
  document.addEventListener('focusin', function (e) {
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) && e.target.type !== 'radio' && e.target.type !== 'checkbox') { clearTimeout(kbT); document.body.classList.add('kb'); }
  });
  document.addEventListener('focusout', function () { kbT = setTimeout(function () { document.body.classList.remove('kb'); }, 120); });

  /* ---- 確認シート ---- */
  var lastFocus = null, urls = [], files = [];
  var PLACE = { company: '企業', home: '自宅（Web／リモート）', school: '学校', other: 'その他' };
  var NAMES = {};
  STAGE.forEach(function (x) { NAMES['stage' + x[0]] = x[1]; });
  FMT.forEach(function (x) { NAMES['fmt' + x[0]] = x[1]; });
  APTK.forEach(function (x) { NAMES['apt' + x[0]] = x[1]; });
  function summaryRows() {
    var rows = [];
    var cl = C.tiny;
    var ym = [cl(S.year) && cl(S.year) + '年', cl(S.cls) && cl(S.cls) + '組', cl(S.num) && cl(S.num) + '番'].filter(Boolean).join(' ');
    rows.push(['学科', S.course + (ym ? '\n' + ym : '')]);
    rows.push(['氏名', C.oneLine(S.name)]);
    rows.push(['企業名', C.oneLine(S.company)]);
    var pl = S.place ? PLACE[S.place] : '';
    if (S.place === 'company' && C.oneLine(S.station)) pl += '（最寄駅：' + C.oneLine(S.station) + '）';
    if (S.place === 'other' && C.oneLine(S.otherPlace)) pl += '（' + C.oneLine(S.otherPlace) + '）';
    rows.push(['場所', pl]);
    var dp = C.dateParts(S.date), dt = '';
    if (dp) dt = dp.m + '月' + dp.d + '日（' + dp.w + '）';
    if (S.start) dt += (dt ? ' ' : '') + S.start + (S.end ? ' ～ ' + S.end : ' ～');
    rows.push(['日時', dt]);
    var a = ACTS.filter(function (x) { return x.v === S.act; })[0];
    var kind = a ? a.t : '';
    if (S.act === 'setsumei' && S.sub) kind += '（' + (S.sub === 'proceed' ? '選考に進む予定' : '選考には進まない予定') + '）';
    rows.push(['種類', kind]);
    if (a) rows.push([a.label, C.cleanBody(S.body)]);
    if (S.act === 'test') {
      rows.push({ head: '受験報告書' });
      rows.push(['職種', C.oneLine(S.r_job)]);
      rows.push(['本社住所', C.oneLine(S.r_addr)]);
      rows.push(['選考段階', NAMES['stage' + S.r_stage] || '']);
      rows.push(['形式', NAMES['fmt' + S.r_fmt] || '']);
      rows.push(['対策', C.cleanBody(S.r_advice)]);
      var n = function (v, u) { v = R.digits(v); return v ? v + u : '－'; };
      if (R.on(S, 'apt')) {
        var ks = R.kinds(S).map(function (k) { return NAMES['apt' + k]; });
        if (R.kinds(S).indexOf('other') >= 0 && C.oneLine(S.r_apt_other)) ks[ks.indexOf('その他')] = 'その他（' + C.oneLine(S.r_apt_other) + '）';
        rows.push(['学科適性', '時間 ' + n(S.r_apt_min, '分') + '\n' + (ks.join('、') || '種類：未選択') + (C.cleanBody(S.r_apt_content) ? '\n' + C.cleanBody(S.r_apt_content) : '')]);
      }
      if (R.on(S, 'gw')) rows.push(['グループワーク', '時間 ' + n(S.r_gw_min, '分') + '　試験官 ' + n(S.r_gw_ex, '人') + '　1グループ ' + n(S.r_gw_size, '人') + (C.oneLine(S.r_gw_theme) ? '\n【テーマ】' + C.oneLine(S.r_gw_theme) : '')]);
      if (R.on(S, 'es')) rows.push(['作文', '時間 ' + n(S.r_es_min, '分') + '　' + n(S.r_es_chars, '字') + (S.r_es_style ? '　' + (S.r_es_style === 'hand' ? '手書き' : 'データ') : '') + (C.oneLine(S.r_es_theme) ? '\n【テーマ】' + C.oneLine(S.r_es_theme) : '')]);
      if (R.on(S, 'iv')) {
        var kd = S.r_iv_kind === 'individual' ? '個人' : S.r_iv_kind === 'group' ? '集団（受験者' + n(S.r_iv_count, '人') + '）' : '';
        rows.push(['面接', '時間 ' + n(S.r_iv_min, '分') + '　試験官 ' + n(S.r_iv_ex, '人') + (kd ? '\n' + kd : '') + (S.r_iv_pres === '1' ? '　プレゼンテーション' : '') + (C.cleanBody(S.r_iv_q) ? '\n' + C.cleanBody(S.r_iv_q) : '')]);
      }
    }
    return rows;
  }
  function openSheet() {
    saveNow();
    var v = validateAll();
    var notes = $('#s-notes'); notes.textContent = '';
    if (v.errors.length) {
      var n = document.createElement('div'); n.className = 'note err';
      n.appendChild(document.createTextNode('次を直すとWordを生成できます。'));
      var ul = document.createElement('ul');
      v.errors.forEach(function (e) { var li = document.createElement('li'); li.textContent = e.msg; ul.appendChild(li); });
      n.appendChild(ul); notes.appendChild(n);
    }
    var miss = v.warnings.filter(function (w) { return !/前です/.test(w.msg); });
    if (miss.length) {
      var w = document.createElement('div'); w.className = 'note warn';
      w.textContent = '未入力: ' + miss.map(function (x) { return x.msg; }).join('、') + '（このままでも生成できます）';
      notes.appendChild(w);
    }
    v.warnings.filter(function (x) { return /前です/.test(x.msg); }).forEach(function (x) {
      var w2 = document.createElement('div'); w2.className = 'note warn'; w2.textContent = x.msg; notes.appendChild(w2);
    });
    var sum = $('#s-sum'); sum.textContent = '';
    var dl = document.createElement('dl');
    summaryRows().forEach(function (r) {
      var row = document.createElement('div');
      if (r.head) { row.className = 'head'; row.textContent = r.head; dl.appendChild(row); return; }
      row.className = 'r';
      var dt = document.createElement('dt'); dt.textContent = r[0];
      var dd = document.createElement('dd');
      if (r[1]) dd.textContent = r[1]; else { dd.textContent = '未入力'; dd.className = 'none'; }
      row.appendChild(dt); row.appendChild(dd); dl.appendChild(row);
    });
    sum.appendChild(dl);
    $('#b-gen').textContent = S.act === 'test' ? 'Wordを2つ生成する（カード＋受験報告書）' : 'Wordを生成する';
    $('#b-gen').disabled = v.errors.length > 0;
    $('#s-confirm').hidden = false; $('#s-done').hidden = true;
    lastFocus = document.activeElement;
    $('#ov').hidden = false; document.body.classList.add('lock');
    $('#sheet').scrollTop = 0; $('#s-title').focus({ preventScroll: true });
  }
  function closeSheet() {
    $('#ov').hidden = true; document.body.classList.remove('lock');
    if (lastFocus && lastFocus.focus) { try { lastFocus.focus({ preventScroll: true }); } catch (e) { } }
  }
  $('#b-open').addEventListener('click', openSheet);
  $('#b-back').addEventListener('click', closeSheet);
  $('#b-back2').addEventListener('click', closeSheet);
  $('#ov').addEventListener('click', function (e) { if (e.target === $('#ov')) closeSheet(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('#ov').hidden) closeSheet(); });

  function safeName(prefix) {
    var c = C.oneLine(S.company) || '企業名', n = C.oneLine(S.name) || '氏名';
    return (prefix + '_' + c + '_' + n).replace(/[\\\/:*?"<>|\s\u3000]+/g, '_').slice(0, 80) + '.docx';
  }
  function triggerDownload(f) {
    var a = document.createElement('a'); a.href = f.url; a.download = f.name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }
  /* 保存: 公開ページでは downloads 機能、ローカルで開いた場合は通常のダウンロード */
  async function saveFile(f) {
    var dl = null;
    try { if (window.claude && window.claude.use) dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
    if (dl) {
      try { await dl.save({ filename: f.name, data: f.blob }); toast('保存しました'); return true; }
      catch (e) {
        if (e && e.code === 'declined') return false;
        if (!e || (e.code !== 'unavailable' && e.code !== 'not_granted' && e.code !== 'capability_disabled' && e.code !== 'capability_removed')) {
          toast('保存できませんでした' + (e && e.message ? '：' + e.message : '')); return false;
        }
      }
    }
    triggerDownload(f); return true;
  }

  /* ---- プレビュー (docx-preview で生成したWordをそのまま描画) ---- */
  var previews = [];
  function fitPreview(pv) {
    var host = pv.host, box = host.querySelector('.pv-box'), inner = host.querySelector('.pv-in');
    var sec = inner && inner.querySelector('section');
    if (!sec) return;
    var nat = 0; $$('section', inner).forEach(function (x) { nat = Math.max(nat, x.offsetWidth); });
    var avail = host.clientWidth - (pv.zoom ? 0 : 16);
    var sc = pv.zoom ? 1 : Math.min(1, avail / nat);
    inner.style.width = nat + 'px'; inner.style.transform = 'scale(' + sc + ')';
    box.style.width = Math.ceil(nat * sc) + 'px'; box.style.height = Math.ceil(inner.offsetHeight * sc + 16) + 'px';
    host.classList.toggle('z', pv.zoom);
  }
  async function renderPreview(f, host) {
    var pv = { host: host, zoom: false };
    host.textContent = ''; host.className = 'pv';
    var msg = document.createElement('div'); msg.className = 'msg'; msg.textContent = 'プレビューを作成中…'; host.appendChild(msg);
    if (!window.docx || !window.docx.renderAsync) { msg.textContent = 'この環境ではプレビューを表示できません（ダウンロードは可能です）'; return pv; }
    var box = document.createElement('div'); box.className = 'pv-box';
    var inner = document.createElement('div'); inner.className = 'pv-in'; box.appendChild(inner);
    var st = document.createElement('div'); st.hidden = true;
    host.appendChild(box); host.appendChild(st);
    try {
      await window.docx.renderAsync(f.blob, inner, st, { inWrapper: false, className: 'docx', breakPages: true, ignoreLastRenderedPageBreak: false, useBase64URL: true });
      msg.remove(); fitPreview(pv);
    } catch (e) { msg.textContent = 'プレビューを作成できませんでした（ダウンロードは可能です）'; box.remove(); }
    return pv;
  }
  window.addEventListener('resize', function () { previews.forEach(fitPreview); });

  function fileBlock(f) {
    var box = document.createElement('div'); box.className = 'file' + (f.allOk ? '' : ' bad');
    var h = document.createElement('h3'); h.textContent = f.title; box.appendChild(h);
    var p = document.createElement('p'); p.className = 'fn'; p.textContent = f.name; box.appendChild(p);
    var host = document.createElement('div'); box.appendChild(host);
    var bar = document.createElement('div'); bar.className = 'pvbar';
    var note = document.createElement('span'); note.textContent = 'プレビューは目安です。文字の幅はWordと少し違うことがあります。';
    var zb = document.createElement('button'); zb.type = 'button'; zb.className = 'link'; zb.textContent = '拡大';
    bar.appendChild(note); bar.appendChild(zb); box.appendChild(bar);
    var b = document.createElement('button'); b.type = 'button'; b.className = 'btn'; b.textContent = 'ダウンロード（.docx）';
    b.addEventListener('click', function () { saveFile(f); }); box.appendChild(b);
    var d = document.createElement('details'); if (!f.allOk) d.open = true;
    var sm = document.createElement('summary');
    sm.textContent = f.allOk ? '構造の確認：' + f.ver.length + '項目すべて問題なし' : '構造の確認：問題が見つかりました';
    d.appendChild(sm);
    var ul = document.createElement('ul'); ul.className = 'vlist';
    f.ver.forEach(function (x) {
      var li = document.createElement('li');
      var m = document.createElement('span'); m.className = x.ok ? 'ok' : 'ng'; m.textContent = x.ok ? '✓' : '✗';
      var t = document.createElement('span'); t.textContent = x.label;
      if (x.detail) { var s2 = document.createElement('small'); s2.textContent = x.detail; t.appendChild(s2); }
      li.appendChild(m); li.appendChild(t); ul.appendChild(li);
    });
    d.appendChild(ul); box.appendChild(d);
    f.host = host; f.zoomBtn = zb;
    return box;
  }
  $('#b-gen').addEventListener('click', async function () {
    var btn = $('#b-gen'), label = btn.textContent; btn.disabled = true; btn.textContent = '生成中…';
    try {
      var mime = 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
      urls.forEach(function (u) { URL.revokeObjectURL(u); }); urls = []; files = [];
      var jobs = [{ title: '就職活動カード', prefix: '就職活動カード', b64: TEMPLATE_B64, gen: C.generate, ver: C.verify }];
      if (S.act === 'test') jobs.push({ title: '受験報告書', prefix: '受験報告書', b64: REPORT_B64, gen: R.generate, ver: R.verify });
      for (var i = 0; i < jobs.length; i++) {
        var j = jobs[i], tpl = C.b64ToBytes(j.b64);
        var out = await j.gen(tpl, S);
        var ver = await j.ver(tpl, out, S);
        var blob = new Blob([out], { type: mime }), url = URL.createObjectURL(blob);
        urls.push(url);
        var name = safeName(j.prefix);
        files.push({ title: j.title, name: name, url: url, blob: blob, ver: ver, allOk: ver.every(function (x) { return x.ok; }), file: new File([blob], name, { type: mime }) });
      }
      var box = $('#s-files'); box.textContent = '';
      previews = [];
      files.forEach(function (f) { box.appendChild(fileBlock(f)); });
      var allOk = files.every(function (f) { return f.allOk; });
      $('#s-title2').textContent = allOk ? (files.length > 1 ? 'Wordを2つ生成しました' : 'Wordを生成しました') : '生成しましたが、確認で問題が見つかりました';
      $('#b-all').hidden = files.length < 2;
      var canShare = !!(navigator.canShare && navigator.canShare({ files: files.map(function (f) { return f.file; }) }));
      $('#b-share').hidden = !canShare;
      $('#s-confirm').hidden = true; $('#s-done').hidden = false;
      $('#sheet').scrollTop = 0; $('#s-title2').focus({ preventScroll: true });
      for (var k = 0; k < files.length; k++) {
        (function (f) {
          renderPreview(f, f.host).then(function (pv) {
            previews.push(pv);
            f.zoomBtn.addEventListener('click', function () { pv.zoom = !pv.zoom; f.zoomBtn.textContent = pv.zoom ? '全体表示' : '拡大'; fitPreview(pv); });
          });
        })(files[k]);
      }
    } catch (e) {
      toast('生成できませんでした: ' + (e && e.message ? e.message : e));
    } finally { btn.disabled = false; btn.textContent = label; }
  });
  $('#b-all').addEventListener('click', function () {
    (async function () { for (var i = 0; i < files.length; i++) { var ok = await saveFile(files[i]); if (!ok) break; if (i < files.length - 1) await new Promise(function (r) { setTimeout(r, 600); }); } })();
  });
  $('#b-share').addEventListener('click', function () {
    if (!files.length) return;
    navigator.share({ files: files.map(function (f) { return f.file; }), title: '就職活動カード' }).catch(function () { });
  });

  /* ---- 新規・消去 ---- */
  function ask(msg, okLabel) {
    return new Promise(function (resolve) {
      var ov = document.createElement('div'); ov.className = 'ov'; ov.style.zIndex = 80;
      var sh = document.createElement('div'); sh.className = 'sheet'; sh.setAttribute('role', 'alertdialog'); sh.setAttribute('aria-modal', 'true');
      var p = document.createElement('p'); p.style.whiteSpace = 'pre-line'; p.style.margin = '4px 0 14px'; p.textContent = msg;
      var acts = document.createElement('div'); acts.className = 'acts';
      var ok = document.createElement('button'); ok.type = 'button'; ok.className = 'btn'; ok.textContent = okLabel || 'OK';
      var no = document.createElement('button'); no.type = 'button'; no.className = 'btn ghost'; no.textContent = 'やめる';
      function done(v) { document.body.removeChild(ov); resolve(v); }
      ok.addEventListener('click', function () { done(true); }); no.addEventListener('click', function () { done(false); });
      acts.appendChild(ok); acts.appendChild(no); sh.appendChild(p); sh.appendChild(acts); ov.appendChild(sh); document.body.appendChild(ov); no.focus();
    });
  }
  $('#b-next').addEventListener('click', async function () {
    if (!(await ask('活動の内容を消して、次のカードを作ります。\n学科・年組番・氏名は残します。', '次のカードを作る'))) return;
    var keep = {}; KEEP.forEach(function (k) { keep[k] = S[k]; });
    S = Object.assign({}, DEFAULTS, keep); setFromState(); render(); saveNow();
    window.scrollTo(0, 0); toast('次のカードの入力を始められます');
  });
  $('#b-clear').addEventListener('click', async function () {
    if (!(await ask('入力した内容をすべて消します。よろしいですか？', 'すべて消す'))) return;
    S = Object.assign({}, DEFAULTS); setFromState(); render(); saveNow(); window.scrollTo(0, 0);
  });

  /* ---- 起動 ---- */
  var restored = load();
  setFromState(); render();
  if (restored) { $('#saved').textContent = '前回の入力を復元しました'; }
  else { $('#saved').textContent = '入力は自動で保存されます'; }
})();
</script>
</body>
</html>
